# SGLang server plus BFCL client. Driven by env vars (scripts/env.sh sets the defaults):
#   MODELS_DIR    host dir holding the checkpoints, mounted at /models (required)
#   MODEL_DIR     checkpoint dir under MODELS_DIR (required)
#   SERVER_ARGS   model-specific server flags incl. --mem-fraction-static (required),
#                 see scripts/args/
#   SPEC_ARGS     extra flags appended after SERVER_ARGS (speculative decoding), empty for none
#   SHM_SIZE      container shared memory (default 72gb)
#   SGLANG_IMAGE  server image
# Benchmarks run inside the containers, so no port is published.
services:
  sglang:
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:nightly-dev-cu13-20261010-961bcf48}
    volumes:
      - ${MODELS_DIR:?set MODELS_DIR}:/models:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - SGLANG_OPT_KDA_FUSED_ACCEPT_STATE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: ${SHM_SIZE:-72gb}
    command: >
        python3 -m sglang.launch_server
        --model-path /models/${MODEL_DIR:?set MODEL_DIR}
        --port 8000
        --host 0.0.0.0
        ${SERVER_ARGS:?set SERVER_ARGS}
        ${SPEC_ARGS:-}

  # Started per run with `docker compose run`, which mounts the output dir at /out.
  bfcl:
    build:
      context: .
      dockerfile: bfcl.Dockerfile
    profiles: [client]
    volumes:
      - ${MODELS_DIR:?set MODELS_DIR}:/models:ro
    environment:
      - LOCAL_SERVER_ENDPOINT=sglang
      - LOCAL_SERVER_PORT=8000
