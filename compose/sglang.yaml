# Model servers (SGLang or llama.cpp) plus benchmark clients. Driven by env vars
# (scripts/env.sh sets the defaults):
#   ENGINE        server service the scripts drive: sglang (default) or llamacpp
#   MODELS_DIR    host dir holding the checkpoints, mounted at /models (required)
#   MODEL_DIR     checkpoint dir under MODELS_DIR (required)
#   SERVER_ARGS   model-specific server flags (required), see scripts/args/; for SGLang incl.
#                 --mem-fraction-static, for llama.cpp incl. -m /models/<file>.gguf
#   SPEC_ARGS     extra SGLang flags appended after SERVER_ARGS (speculative decoding), empty for none
#   SHM_SIZE      container shared memory (default 72gb)
#   DATASETS_DIR  host dir with benchmark datasets, mounted read-only at /datasets in the clients
#                 (scripts that need it check it is set)
#   SGLANG_IMAGE  SGLang server image; also the bench-client image
#   LLAMACPP_IMAGE  llama.cpp server image
#   SERVER_ENV_FILE  optional env file for the server (default: none)
# Benchmarks run inside the containers, so no port is published.
services:
  sglang:
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:nightly-dev-cu13-20261010-961bcf48}
    volumes:
      - ${MODELS_DIR:?set MODELS_DIR}:/models:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - SGLANG_OPT_KDA_FUSED_ACCEPT_STATE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    env_file:
      - path: ${SERVER_ENV_FILE:-/dev/null}
        required: false
    shm_size: ${SHM_SIZE:-72gb}
    command: >
        python3 -m sglang.launch_server
        --model-path /models/${MODEL_DIR:?set MODEL_DIR}
        --port 8000
        --host 0.0.0.0
        ${SERVER_ARGS:?set SERVER_ARGS}
        ${SPEC_ARGS:-}

  # Started by `docker compose up llamacpp` (ENGINE=llamacpp); the profile keeps it out of
  # plain `up`.
  llamacpp:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp@sha256:0283744a35a6e7698b4f7a2d63360233dc769ece51e84bdba7aa187a33978276}
    profiles: [llamacpp]
    volumes:
      - ${MODELS_DIR:?set MODELS_DIR}:/models:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
        --host 0.0.0.0
        --port 8000
        ${SERVER_ARGS:?set SERVER_ARGS}

  # sglang.benchmark.serving for servers other than SGLang, which have no SGLang install to
  # exec into. Started per run with `docker compose run`, which mounts the output dir at /out.
  bench-client:
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:nightly-dev-cu13-20261010-961bcf48}
    profiles: [client]
    volumes:
      - ${MODELS_DIR:?set MODELS_DIR}:/models:ro
      - ${DATASETS_DIR:-./datasets-unset}:/datasets:ro
      # ShareGPT and other downloads, kept across runs.
      - bench-client-cache:/root/.cache

  # Started per run with `docker compose run`, which mounts the output dir at /out.
  bfcl:
    build:
      context: .
      dockerfile: bfcl.Dockerfile
    profiles: [client]
    volumes:
      - ${MODELS_DIR:?set MODELS_DIR}:/models:ro
    environment:
      - LOCAL_SERVER_ENDPOINT=${ENGINE:-sglang}
      - LOCAL_SERVER_PORT=8000

volumes:
  bench-client-cache:
